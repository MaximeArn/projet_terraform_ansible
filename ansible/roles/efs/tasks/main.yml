- name: Install amazon-efs-utils
  ansible.builtin.dnf:
    name: amazon-efs-utils
    state: present

- name: Create EFS mount point
  ansible.builtin.file:
    path: "{{ efs_mount_path }}"
    state: directory
    mode: "0755"

- name: Mount EFS file system
  ansible.posix.mount:
    path: "{{ efs_mount_path }}"
    src: "{{ efs_dns_name }}:/"
    fstype: efs
    opts: "_netdev,tls"
    state: mounted
